# lint 、 test 、 build を確認します。
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:

  lint-test-build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: npm

    - run: npm ci

    - run: npm run lint

    - run: npm test

    - run: npm run build

  docker:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - run: docker compose build

    # NOTE: README の手順どおり compose 経由で lint 、 test 、 build が通ることを確認します。
    - run: docker compose run --rm app npm run lint

    - run: docker compose run --rm app npm test

    - run: docker compose run --rm app npm run build
